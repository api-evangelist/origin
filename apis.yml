aid: origin
name: Origin
description: Origin (Origin Markets) is a digital debt capital markets (DCM) platform that
  automates bond issuance from front to back, connecting issuers, dealers, lawyers, and
  market infrastructure on a single platform. Its products cover automated transaction
  Documentation (termsheets and final terms with collaborative review and e-signing),
  Structured Notes, and a Marketplace database of 1,000+ issuers. Origin publishes a
  read-only Trades API and the open Airbrush "universal data language" (an ISO 20022-aligned
  OpenAPI specification) for post-trade straight-through processing across the ecosystem.
